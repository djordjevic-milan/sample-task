app:
  name: react-app

ingress:
  enabled: true
  host: react-app.local
  tls: true
  tlsSecret: react-app-tls
  tlsCrt: 
  tlsKey: 
  paths:
    - path: /static
      service: react-app-frontend
      port: 3001
    - path: /user
      service: react-app-backend
      port: 3000

services:
  - name: frontend
    enabled: true
    replicas: 1
    image: ghcr.io/djordjevic-milan/userlist-frontend:latest
    env:
      - name: API_URL
        value: "http://api:3000"
      - name: NODE_ENV
        value: "production"
      - name: REQUESTED_API_URL
        value: "http://backend:3000/api"
    secret: []  # No secrets for frontend
    probes:
      readiness:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
      liveness:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 15
        periodSeconds: 20
        failureThreshold: 5

  - name: backend
    enabled: true
    replicas: 1
    image: ghcr.io/djordjevic-milan/userlist-backend:latest
    env:
      - name: DB_HOST
        value: "mysql"
      - name: DB_PORT
        value: "3306"
      - name: DB_NAME
        value: "appdb"
    secret:
      - key: DB_USER
        value: "root"
      - key: DB_PASSWORD
        value: "pass123"
    ## Disabled!!! Liveness probe is possible only when database is already inisialized, but at first start we have to initialaze DB manually from application.
