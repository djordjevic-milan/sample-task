apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: react-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/djordjevic-milan/userlist-backend:latest
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          ## Disabled!!! Liveness probe is possible only when database is already inisialized, but at first start we have to initialaze DB manually from application.
          # readinessProbe:
          #   httpGet:
          #     path: /user
          #     port: 3000
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /user
          #     port: 3000
          #   initialDelaySeconds: 15
          #   periodSeconds: 20
          #   failureThreshold: 5

